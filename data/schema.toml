# ═══════════════════════════════════════════════════════════════════════════════
#  The schema for a dataset card's front matter.
# ═══════════════════════════════════════════════════════════════════════════════
#
#  This file is the validator: layouts/partials/validate.html loops over it as it
#  renders each dataset page and calls Hugo's `errorf` on a broken rule, so a card
#  with a missing required field or an out-of-vocabulary value fails the build.
#  There is no separate check command to remember.
#
#  Two main rules:
#
#    1. A field exists only if the website shows it. Anything a reader never
#       sees belongs in the card's prose.
#    2. Optional means the site still works without it. A missing optional field
#       either falls back to the default named in its help, or renders nothing.
#
#  To add a field: add it here, use it in a template, and document it in
#  template/index.md.

# Identity

[[field]]
name        = "title"
type        = "string"
required    = true
help        = "The name readers will see. Also the page heading and the sort key."

[[field]]
name        = "description"
type        = "string"
required    = true
help        = "One sentence, plain language, saying what the dataset contains."

# Catalogue

# To add a task (e.g. Counting, Tracking, Pose estimation), add it to `values`
# below. It then gets its own checkbox in the Task filter on the home page, and
# counts in the "tasks" number, as soon as a published dataset uses it.

[[field]]
name        = "task"
type        = "list"
required    = true
values      = [
  "Detection",
  "Classification",
  "Segmentation",
]
help        = "The computer vision tasks the annotations support. A list of one or more tasks. To add a task that is not listed, add it to `values` for this field in data/schema.toml."

# What the dataset covers. The table shows the class count and rank together,
# e.g. "1000 genera", with the taxonomic scope (the orders or classes) beneath it.

[[field]]
name        = "taxonomic_rank"
type        = "string"
required    = true
values      = ["species", "genus", "family", "order", "mixed", "generic"]
help        = "The rank the images are labelled at. mixed = labels at several ranks. generic = one class with no taxonomic label, such as 'insect' or 'arthropod', as in many detection datasets that find insects without naming them."

[[field]]
name        = "class_count"
type        = "int"
required    = true
help        = "How many distinct classes the labels hold, e.g. 1000 for a dataset of 1000 genera. 1 for a detection dataset whose only class is 'insect'."

# The allowed names live in data/taxa.toml rather than in `values` here, because
# the site also needs to know which of them are insect orders.

[[field]]
name        = "taxonomic_scope"
type        = "list"
required    = true
values_from = "taxa"
help        = "The insect orders the dataset covers, e.g. [\"Coleoptera\", \"Lepidoptera\"]. Write [\"Insecta\"] for insects broadly or when the orders are not known; it matches every insect order, so do not list orders beside it. Non-insects are listed by class, e.g. [\"Insecta\", \"Arachnida\"]. The allowed names are in data/taxa.toml; to add one, add it there. Finer detail (families, genera) goes in the card's Contents section."

[[field]]
name        = "background"
type        = "list"
required    = true
values      = ["simple", "complex"]
help        = "simple = uniform backgrounds such as light traps, sticky traps, white trays or lab surfaces. complex = cluttered field imagery such as flowers, foliage or soil. A dataset with both lists both."

[[field]]
name        = "geographic_scope"
type        = "string"
required    = true
help        = "Where the images were taken, e.g. 'Denmark', 'Western Europe', 'Global'. Write 'Not stated' if the source does not say."

[[field]]
name        = "composition"
type        = "string"
required    = true
values      = ["self-contained", "aggregated"]
help        = "self-contained = collected as one dataset. aggregated = assembled from several separate datasets; name them in the card's Sources section."

# Contextual data: what comes with the images. The home page shows only whether
# there is any; the card lists what it is.

[[field]]
name        = "has_contextual_data"
type        = "bool"
required    = true
help        = "true if the dataset comes with data beyond the images and their labels, such as collection location, date or DNA. false if it is images and labels only. No quotes."

[[field]]
name        = "contextual_data"
type        = "list"
required    = false
required_when = "has_contextual_data"
values      = ["location", "collection-date", "time-of-day", "genetic", "environmental", "trap-metadata", "morphological", "other"]
help        = "What the contextual data is. Required when has_contextual_data = true, and must be left out when it is false. Describe it in detail in the card's Contextual data section."

[[field]]
name        = "year"
type        = "int"
required    = true
help        = "Year of publication or release. 4-digit number, no quotes."

[[field]]
name        = "license"
type        = "string"
required    = true
help        = "SPDX identifier where one exists, e.g. CC-BY-4.0, CC0-1.0. See them at https://spdx.org/licenses/."

[[field]]
name        = "status"
type        = "string"
required    = true
values      = ["draft", "published", "deprecated"]
help        = "Only 'published' appears on the site. New cards default to draft."

[[field]]
name        = "date"
type        = "date"
required    = false
help        = "When the entry was added to the registry. ISO date, e.g. 2026-09-30."

# Provenance

[[field]]
name        = "developer"
type        = "string"
required    = false
help        = "Who made it. e.g. 'Dohn, Joe et al.'."

[[field]]
name        = "paper_url"
type        = "string"
required    = false
help        = "Link to the paper describing the dataset, or its project page."

# Data location

[[field]]
name        = "doi"
type        = "string"
required    = false
help        = "The dataset's own DOI, without the https://doi.org/ prefix, e.g. '10.5281/zenodo.1234567'. The DOI of the data, not of the paper."

[[field]]
name        = "hosting_status"
type        = "string"
required    = false
values      = ["hosted", "hosted_restricted", "link_only", "pending_rights"]
help        = "This repo does not mirror data, so this is almost always link_only, which is the default."

[[field]]
name        = "commercial_use"
type        = "string"
required    = false
values      = ["allowed", "prohibited", "permission_required", "unknown"]
help        = "What the license permits. Default: unknown."

# The dataset's own card on Hugging Face, if it has one. The site links to it, and to the pinned revision you curated.

[[field]]
name        = "hf_repo"
type        = "string"
required    = false
help        = "Hugging Face dataset id, e.g. 'imageomics/TreeOfLife-10M'. Renders a link to the dataset's own card."

[[field]]
name        = "hf_revision"
type        = "string"
required    = false
help        = "The commit hash of that repo, as curated. The site links to BOTH this pinned revision and the latest. If hf_repo is set, this is required - an unpinned link can change under the catalogue without the catalogue changing."

# Where to download the dataset. One [[assets]] block per file.
[[field]]
name        = "assets"
type        = "list"
required    = true
providers   = ["zenodo", "huggingface", "github", "erda", "kaggle", "roboflow", "figshare", "dryad", "gbif", "url", "google-drive", "dropbox"]
help        = """
Where to download the dataset. One [[assets]] block per file; the FIRST is the one
the table links to, and its provider is shown as the dataset's host. Each block
needs a key (the label), a provider and a url. Data is never committed to this
repository.

  [[assets]]
  key      = "images"
  provider = "zenodo"
  url      = "https://zenodo.org/records/1234567"
"""
